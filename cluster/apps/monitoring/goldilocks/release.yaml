---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: goldilocks
      version: 11.2.0
      sourceRef:
        kind: HelmRepository
        name: chart-fairwinds
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: vpa
      namespace: monitoring
  values:
    controller:
      rbac:
        # Goldilocks walks pod ownerRefs to the top-level controller; these CRD
        # owners (CNPG Cluster, Prometheus/Alertmanager CRs) need read access
        extraRules:
          - apiGroups: ["postgresql.cnpg.io"]
            resources: ["clusters"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["monitoring.coreos.com"]
            resources: ["prometheuses", "alertmanagers"]
            verbs: ["get", "list", "watch"]
      resources:
        requests:
          cpu: 15m
          memory: 105Mi
        limits:
          memory: 210M
    dashboard:
      replicaCount: 1
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - host: &host goldilocks.${SECRET_DOMAIN}
            paths:
              - path: /
                type: Prefix
        tls:
          - hosts:
              - *host
      resources:
        requests:
          cpu: 15m
          memory: 105M
        limits:
          memory: 210M

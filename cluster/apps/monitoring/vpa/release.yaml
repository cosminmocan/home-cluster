---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: vpa
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: chart-fairwinds
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    # Helm never upgrades crds/; VPA 1.7 (chart v5) needs the newer CRDs.
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
  values:
    recommender:
      enabled: true
      image:
        repository: registry.k8s.io/autoscaling/vpa-recommender
        tag: 1.7.1
      extraArgs:
        prometheus-address: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
        storage: prometheus
        # Defaults target a legacy Prometheus layout; map them to kube-prometheus-stack
        # names. metric-for-pod-labels is sent as an instant query → needs a range.
        prometheus-cadvisor-job-name: kubelet
        container-pod-name-label: pod
        container-name-label: container
        container-namespace-label: namespace
        pod-namespace-label: namespace
        pod-name-label: pod
        pod-label-prefix: label_
        metric-for-pod-labels: 'kube_pod_labels{job="kube-state-metrics"}[8d]'
      resources:
        requests:
          cpu: 15m
          memory: 105M
    updater:
      enabled: false
    admissionController:
      enabled: false

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prowlarr
  namespace: media
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: chart-bjw
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  values:
    controllers:
      prowlarr:
        pod:
          hostname: prowlarr
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        initContainers:
          # Wait until Postgres accepts connections before the app starts its DB
          # migration — prevents the boot race (e.g. after a node reboot) that left
          # Prowlarr stuck in "waiting for user intervention".
          wait-for-db:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 17.11-standard-trixie
            env:
              POSTGRES_HOST: "${POSTGRES_HOST_ADDRESS}"
            command:
              - sh
              - -c
              - until pg_isready -h "$POSTGRES_HOST" -p 5432 -U postgres; do echo "waiting for postgres..."; sleep 3; done
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.7.0.5723
            env:
              TZ: ${TIMEZONE}
              PROWLARR__LOG__LEVEL: info
              # Servarr env vars must be PROWLARR__<SECTION>__<KEY> (config.xml sections);
              # single-underscore names are silently ignored. Update branch comes from the
              # image's package_info, and ApplicationUrl is a UI/DB setting (set via API) —
              # neither can be set here.
              PROWLARR__POSTGRES__HOST: "${POSTGRES_HOST_ADDRESS}"
              PROWLARR__POSTGRES__MAINDB: prowlarr-main
              PROWLARR__POSTGRES__LOGDB: prowlarr-log
              PROWLARR__POSTGRES__USER: "postgres"
              PROWLARR__POSTGRES__PASSWORD: "${SECRET_POSTGRES_ADMIN_PASS}"
              PROWLARR__SERVER__PORT: &port 9696
              PROWLARR__AUTH__APIKEY: "${PROWLARR_SECRET_KEY}"
            resources:
              requests:
                cpu: 15m
                memory: 220Mi
              limits:
                memory: 350Mi
            # HTTP probes on /ping (unauthenticated). Startup gives slow first-boot
            # (DB migration) room; liveness restarts a stuck app instead of leaving
            # it "ready" but dead; readiness only sends traffic when actually serving.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /ping, port: 9696 }
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /ping, port: 9696 }
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /ping, port: 9696 }
                  periodSeconds: 15
                  failureThreshold: 3
          metrics:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0
            args: ["prowlarr"]
            env:
              PORT: &metrics-port 9708
              URL: "http://localhost:9696"
              APIKEY: "${PROWLARR_SECRET_KEY}"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: *port
          metrics:
            port: *metrics-port
    ingress:
      prowlarr:
        className: traefik
        hosts:
          - host: &host "prowlarr.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - *host
    persistence:
      config:
        existingClaim: prowlarr-config-v2
        globalMounts:
          - path: /config

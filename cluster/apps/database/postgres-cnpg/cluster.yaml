---
# Shared PostgreSQL managed by CloudNativePG (replaces the frozen bitnamilegacy
# chart). Reachable at ${POSTGRES_HOST_ADDRESS} (the postgres-cnpg-rw Service).
# Bootstrapped once by a logical import (pg_dump/pg_restore) from the old
# Bitnami server; the import block is ignored after the cluster exists.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cnpg
  namespace: database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-minimal-trixie
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-cnpg-superuser
  storage:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 768Mi
  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - authentik
          - paperless
          - radarr-main
          - radarr-log
          - prowlarr-main
          - prowlarr-log
        source:
          externalCluster: bitnami-postgresql
  externalClusters:
    - name: bitnami-postgresql
      connectionParameters:
        host: postgresql.database.svc.cluster.local
        user: postgres
        dbname: postgres
        sslmode: disable
      password:
        name: postgres-cnpg-superuser
        key: password

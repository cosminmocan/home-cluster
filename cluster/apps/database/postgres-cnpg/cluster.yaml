---
# Shared PostgreSQL managed by CloudNativePG (replaces the frozen bitnamilegacy
# chart). Reachable at ${POSTGRES_HOST_ADDRESS} (the postgres-cnpg-rw Service).
# Data was migrated on 2026-10-29 by a one-off logical import from the old
# Bitnami server (since removed). A fresh bootstrap (CNPG default initdb) starts empty — restore
# from a pg_dumpall backup if the cluster ever has to be recreated.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cnpg
  namespace: database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-cnpg-superuser
  storage:
    size: 5Gi
    storageClass: longhorn
  # Sized from observed usage (peak ~280Mi, p95 ~50m CPU) with headroom for
  # vacuum / index builds / pg_dump; shared_buffers stays at the 128MB default.
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: chart-external-dns
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: traefik
      namespace: networking
  values:
    interval: 2m
    provider: cloudflare
    env:
      - name: CF_API_EMAIL
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: SECRET_CLOUDFLARE_EMAIL
      - name: CF_API_KEY
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: CLOUDFLARE_APIKEY
    extraArgs:
      - --cloudflare-proxied
      # v0.22+ only reads the external-dns.kubernetes.io/ prefix; this flag maps the
      # legacy external-dns.alpha.kubernetes.io/ annotations on our ingresses to it
      # *before* the annotation filter runs, so the filter must use the new prefix.
      # Without both, policy=sync rewrites public CNAMEs to the LAN ingress IP.
      - --enable-legacy-annotation-prefix
      - --annotation-filter=external-dns.kubernetes.io/target
    policy: sync
    sources: ["ingress"]
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters: ["${SECRET_DOMAIN}"]
    podAnnotations:
      secret.reloader.stakater.com/reload: cluster-secrets

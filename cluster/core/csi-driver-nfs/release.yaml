---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.6
      sourceRef:
        kind: HelmRepository
        name: chart-csi-driver-nfs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      # No VolumeSnapshot CRDs in the cluster
      enableSnapshotter: false
    externalSnapshotter:
      enabled: false
    # Replaces nfs-subdir-external-provisioner; same class name, NAS share and dir layout
    storageClass:
      create: true
      name: nfs-client
      parameters:
        server: "${STORAGE_NAS_IP}"
        share: /volume1/kubeNFS
        # $$ escapes Flux postBuild substitution; resolved by the CSI provisioner
        subDir: "$${pvc.metadata.namespace}-$${pvc.metadata.name}-$${pv.metadata.name}"
        onDelete: archive
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
